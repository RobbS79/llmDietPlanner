name: tests

# Test gate: runs the backend unit suite and the frontend unit tests + typecheck
# on every PR into develop and on pushes to develop/prod. Its purpose is to stop
# a red test from slipping in unnoticed (a stale test sat broken for days before
# this gate existed).
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, prod]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Django)
    runs-on: ubuntu-latest
    # A few task-integration tests call Celery tasks via `.apply().get()`; on
    # failure the task's `.retry()` re-enqueues through the broker, so without a
    # reachable Redis the run hangs 20x on "Connection to Redis lost". The
    # CELERY_BROKER_URL / RESULT_BACKEND settings default to redis://127.0.0.1:6379,
    # which this service satisfies.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # settings.py requires these two (no defaults). CI runs against an
      # ephemeral sqlite DB (DATABASE_URL is unset, so settings default to
      # sqlite) with no real encrypted data, so these are throwaway CI values,
      # NOT production secrets.
      SECRET_KEY: ci-test-secret-key
      FIELD_ENCRYPTION_KEY: A3xtMz5NmwN6oYF5JJGiBXCxTLrf6vSL272zJSfyC-w=
      DEBUG: "True"
      # Dummy, non-functional value. A couple of catalog-task tests construct
      # GeminiService() (whose __init__ requires the key) but mock the actual
      # generation method, so this only needs to be PRESENT — no real API call
      # is made. (Locally the suite picked this up from the box's .env file,
      # which CI does not have.)
      GEMINI_API_KEY: ci-dummy-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests (sqlite)
        # Scoped to the apps with a green, self-contained unit suite.
        # EXCLUDED (not unit-testable here):
        #   - e2e / slack_bot: require a real browser / Slack, not unit CI.
        # (login_app was previously quarantined for 10 pre-existing failures —
        #  the dropped verify-email endpoint and broker-blocking registration;
        #  both fixed, so it is gated again.)
        #
        # pytest, NOT `manage.py test`: four modules are written pytest-native
        # (bare `def test_*`, `pytest.raises`, the monkeypatch fixture), and
        # Django's runner collects only unittest.TestCase subclasses — so it
        # silently ran 46 fewer tests while still reporting success. pytest
        # collects a verified strict superset (see pytest.ini's python_files).
        run: python -m pytest diet_planner billing analytics login_app -q

  frontend:
    name: frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run frontend unit tests
        run: npm run test
        # NOTE: `npm run lint` is intentionally NOT gated — the repo sits at a
        # known ~52-error eslint baseline. Add a lint job once that is cleaned
        # up so it can start green.
