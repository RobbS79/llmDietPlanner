[pytest]
DJANGO_SETTINGS_MODULE = llm_diet_planner_project.settings

# MUST stay a superset of Django's own discovery pattern (`test*.py`), because
# pytest is now the only runner CI uses. pytest's default is `test_*.py`, which
# silently skipped 44 real tests living in files Django did collect:
#   - billing/tests.py, analytics/tests.py        (41 tests, no underscore)
#   - login_app/tests_seed_qa_account.py          (3 tests, underscore in the
#                                                  wrong place)
# A skipped file looks identical to a passing one in the summary line, so
# verify with `--collect-only` after touching this, not by reading the count.
python_files = test*.py *_test.py
