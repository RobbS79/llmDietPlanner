# Bootstrap CanonicalIngredient list. Loaded by `manage.py seed_canonical_ingredients`.
#
# Schema per entry:
#   name:                  Required. English canonical name.
#   slug:                  Optional; auto-derived from `name` if absent.
#   name_cs / name_sk:     Optional localized names.
#   category:              CanonicalIngredient.Category value (default: other).
#   default_unit:          Storage unit, default 'g'.
#   is_pantry_staple:      Always-available flag (no store match required).
#   estimated_price_czk / estimated_price_eur:
#                          Fallback prices used when no PriceRecord exists.
#   aliases:               Optional list of {alias, language_code} for matching.
#   nutrition:             Optional block, per 100 g of the AS-BOUGHT form (raw meat, dry pasta):
#                            kcal, protein, carbs, fat  - all four required for a usable row
#                            density:         g per ml (only if used in volume units)
#                            piece_weight_g:  grams per "1 ks"
#                            unit_weights:    {unit: grams} for ingredient-specific count units
#                            source:          usda:<fdc_id> | frida:<id> | manual:<note>
#                            usda_query:      optional search hint for import_usda_nutrition
#
# Initial bootstrap is intentionally narrow (pantry staples + the highest-
# turnover categories). Expand as new StoreProduct rows surface in Phase C
# matching review.

