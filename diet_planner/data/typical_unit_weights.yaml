# Typical edible weight in grams per piece, for count-unit ("ks") canonicals
# that Czech stores sell by weight. Used by build_price_book and the pricer to
# bridge "2 ks onion" (recipe) <-> "1 kg net @ 19.90" (Rohlík catalog), so real
# catalog prices seed the book instead of being discarded on a unit mismatch.
#
# These are reviewable reference values (not prices). Adjust to taste.
# NOTE: `garlic` is ambiguous — a recipe "ks" may mean a single clove (~5 g) or
# a whole head/bulb (~50 g). Set to clove weight, since recipes usually count
# cloves ("stroužky"); revisit if your corpus counts heads.
grams_per_piece:
  onion: 110
  garlic: 5          # one clove (see note above)
  shallot: 30
  lemons: 100
  lime: 67
  bell-pepper: 150
  chili-pepper: 15
  avocado: 170
  cucumber: 300
  zucchini: 250
  eggplant: 250
  mango: 200
  leek: 150
  fennel: 250
  radicchio: 250

  # --- added 2026-08-24 for the nutrition-basis repair -------------------
  # These were the count-unit lines the mass estimator could not resolve in
  # the published corpus (`eggs` alone appeared on 36 lines). Edible weight,
  # i.e. egg without shell. Ambiguous ones are deliberately absent: `beans`
  # ("1 ks" is a can in some rows, a pod in others) would over-count mass,
  # and over-counting is the one direction that could wave a bad repair
  # through -- see nutrition_basis_repair.
  eggs: 55
  potatoes: 150
  carrots: 80
  tomatoes: 120
  spring-onion: 15
  celery-root: 300      # a whole root; rows saying "1/4 celeru" store 0.25
  parsley: 30           # a bunch/sprigs, not the root
  tortilla: 45
  chicken-thigh: 130
  chicken-breast: 170
  salmon-fillet: 150
  mushrooms: 20
  apples: 180
  bananas: 120
  cauliflower: 600
  beetroot: 150
  radishes: 15
  pickles: 40
  olives: 4
  dates: 8
  bay-leaves: 0.2
  allspice: 0.1
  black-pepper: 0.05    # one peppercorn
