# Lidl Czech Republic staples — items reliably stocked year-round.
# Used by `manage.py seed_store_staples --chain=LIDL_CZ` to populate StoreProduct
# rows (without prices — PriceRecord rows come from scrapes).
#
# Per-row schema:
#   name:           Required. Display name as Lidl sells it.
#   canonical_slug: Required. Must match a CanonicalIngredient.slug.
#   package_size:   Optional. Numeric value.
#   package_unit:   Optional. Unit (g/kg/ml/l/ks).
#   brand:          Optional.
#   external_id:    Optional. Lidl SKU if known.
#
# Initial seed is intentionally minimal — to be expanded via Gemini-suggested
# candidates (see GeminiService.suggest_store_staples) and human review.

