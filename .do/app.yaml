name: llm-diet-planner
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/llmDietPlanner
      branch: prod
      deploy_on_push: true
    dockerfile_path: Dockerfile.prod
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
    envs:
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      # Bootstrap admin password for start.sh's createsuperuser step.
      # Set this as an encrypted SECRET in the DO dashboard; never commit a
      # literal (incident 2026-06-02-dbminer). If unset, superuser is skipped.
      - key: DJANGO_SUPERUSER_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: FIELD_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: ALLOWED_HOSTS
        value: "eatalnicek.eu,squid-app-6avsy.ondigitalocean.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://eatalnicek.eu,https://squid-app-6avsy.ondigitalocean.app"
      - key: FRONTEND_URL
        value: "https://eatalnicek.eu"
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_REDIRECT_URI
        value: "https://eatalnicek.eu/api/auth/google/callback/"
        scope: RUN_TIME
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "admin@kentakin.eu"
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DEFAULT_FROM_EMAIL
        value: "DietPlanner <admin@kentakin.eu>"
      - key: CELERY_BROKER_URL
        value: "redis://127.0.0.1:6379/0"
      - key: CELERY_RESULT_BACKEND
        value: "redis://127.0.0.1:6379/0"
    routes:
      - path: /
    run_command: /app/start.sh
jobs:
  - name: curate-batch
    kind: PRE_DEPLOY  # runs on-demand (DO requires a kind; PRE_DEPLOY is
                     # the most appropriate for an idempotent one-off curation
                     # job; trigger via 'doctl apps create-deployment' or
                     # the DO Console "Run Job" button).
    github:
      repo: YOUR_GITHUB_USERNAME/llmDietPlanner
      branch: prod
    dockerfile_path: Dockerfile.prod
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: >-
      python manage.py build_curated_recipes
      --index ${BATCH_FILE:-docs/curated-recipe-index-batch01.json}
      --sleep 1
    envs:
      # The batch file to curate. Override per run via the DO Console's
      # "Run Job" form or by deploying with a different value.
      - key: BATCH_FILE
        value: "docs/curated-recipe-index-batch01.json"
      # Inherit the prod secrets the curation pipeline needs.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FIELD_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DEBUG
        value: "False"
domains:
  - domain: eatalnicek.eu
    type: PRIMARY
    zone: eatalnicek.eu
  - domain: www.eatalnicek.eu
    type: ALIAS
    zone: eatalnicek.eu