name: llm-diet-planner
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/llmDietPlanner
      branch: prod
      deploy_on_push: true
    dockerfile_path: Dockerfile.prod
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs  # Upgraded from basic-xxs for more memory (75-80% usage was too high)
    health_check:
      http_path: /
    envs:
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: ALLOWED_HOSTS
        value: "your-app-name.ondigitalocean.app"
      - key: CELERY_BROKER_URL
        value: "redis://127.0.0.1:6379/0"
      - key: CELERY_RESULT_BACKEND
        value: "redis://127.0.0.1:6379/0"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DEFAULT_FROM_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
    routes:
      - path: /
    run_command: /app/start.sh

