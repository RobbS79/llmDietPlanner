name: llm-diet-planner
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/llmDietPlanner
      branch: prod
      deploy_on_push: true
    dockerfile_path: Dockerfile.prod
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
    envs:
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FIELD_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: ALLOWED_HOSTS
        value: "eatalnicek.eu,squid-app-6avsy.ondigitalocean.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://eatalnicek.eu,https://squid-app-6avsy.ondigitalocean.app"
      - key: FRONTEND_URL
        value: "https://eatalnicek.eu"
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_REDIRECT_URI
        value: "https://eatalnicek.eu/api/auth/google/callback/"
        scope: RUN_TIME
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "admin@kentain.eu"
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DEFAULT_FROM_EMAIL
        value: "DietPlanner <admin@kentain.eu>"
      - key: CELERY_BROKER_URL
        value: "redis://127.0.0.1:6379/0"
      - key: CELERY_RESULT_BACKEND
        value: "redis://127.0.0.1:6379/0"
    routes:
      - path: /
    run_command: /app/start.sh